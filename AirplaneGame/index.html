<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网页版飞机大战</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #555;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .stats { margin-bottom: 10px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="stats">得分: <span id="score">5</span></div>
    <canvas id="gameCanvas" width="550" height="350"></canvas>
    <p>控制：ASWD 移动 | 空格 发射子弹 [cite: 66, 74]</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // 游戏状态
        let score = 5; // 初始分数 
        let gameActive = true;
        const keys = {};

        // 玩家飞机对象 [cite: 59, 61]
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            width: 30,
            height: 30,
            speed: 5
        };

        const bullets = [];
        const enemies = [];

        // 监听按键 [cite: 6, 7]
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ' && gameActive) {
                bullets.push({ x: player.x + player.width/2 - 2, y: player.y, w: 4, h: 10 });
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // 游戏循环
        function update() {
            if (!gameActive) return;

            // 移动玩家 [cite: 66, 67]
            if (keys['w'] && player.y > 0) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - player.height) player.y += player.speed;
            if (keys['a'] && player.x > 0) player.x -= player.speed;
            if (keys['d'] && player.x < canvas.width - player.width) player.x += player.speed;

            // 更新子弹
            bullets.forEach((b, i) => {
                b.y -= 7;
                if (b.y < 0) bullets.splice(i, 1);
            });

            // 生成敌机 [cite: 65]
            if (Math.random() < 0.03 && enemies.length < 10) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    w: 30,
                    h: 20,
                    speed: 2
                });
            }

            // 更新敌机
            enemies.forEach((e, i) => {
                e.y += e.speed;
                // 碰撞检测：子弹击中敌机 
                bullets.forEach((b, bi) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(i, 1);
                        bullets.splice(bi, 1);
                        score++;
                    }
                });

                // 碰撞检测：敌机撞击玩家 
                if (e.x < player.x + player.width && e.x + e.w > player.x && e.y < player.y + player.height && e.y + e.h > player.y) {
                    enemies.splice(i, 1);
                    score--;
                }

                if (e.y > canvas.height) enemies.splice(i, 1);
            });

            scoreEl.innerText = score;
            if (score <= 0) {
                gameActive = false;
                alert("游戏结束！最终得分: " + score);
                location.reload();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画玩家 (简单的几何图形代替字符样式)
            ctx.fillStyle = '#00faff';
            ctx.fillRect(player.x, player.y + 10, player.width, player.height - 10); // 机身
            ctx.fillRect(player.x + 10, player.y, 10, 10); // 机头

            // 画子弹
            ctx.fillStyle = '#ff0';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // 画敌机
            ctx.fillStyle = '#ff4444';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(e.x, e.y);
                ctx.lineTo(e.x + e.w, e.y);
                ctx.lineTo(e.x + e.w/2, e.y + e.h);
                ctx.fill();
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
